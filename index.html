<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>Turnos DJ</title>
<meta http-equiv="refresh" content="0; url=turnos/">
<link rel="canonical" href="turnos/">
<script>location.replace('turnos/' + location.search + location.hash);</script>
</head>
<body style="font-family:system-ui,sans-serif;background:#0A0A10;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0">
<p>Abriendo <a href="turnos/" style="color:#4C8DFF">Turnos DJ</a>…</p>
<script>
/* Quita el service worker antiguo de la app de Exámenes (ya no existe) */
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations()
  .then(rs => rs.forEach(r => { if (!new URL(r.scope).pathname.includes('/turnos/')) r.unregister(); })).catch(() => {});
</script>
</body>
</html>
