<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0A18">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Turnos DJ">
<meta name="description" content="Turnos, cachés e ingresos de CLEMENT y DJ Bota, sincronizados con Google Calendar.">
<title>Turnos DJ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<!-- Pantalla de selección de agenda -->
<div id="selector">
    <div class="sel-box">
    <p class="sel-kicker">Turnos DJ</p>
    <h1>¿Qué agenda abrimos?</h1>
    <div class="owners">
      <button class="owner o-clement" style="--oc:var(--clement)" data-act="own" data-own="Clement" aria-label="Abrir la agenda de CLEMENT">
        <span class="owner-art"><img class="wordmark" src="img/clement.png" alt="CLEMENT"><i class="slash" aria-hidden="true"></i></span>
        <span class="ro">Turnos en solitario y de Two Generation's</span>
      </button>
      <button class="owner o-bota" style="--oc:var(--bota)" data-act="own" data-own="DJ Bota" aria-label="Abrir la agenda de DJ Bota">
        <span class="owner-art"><img class="wordmark" src="img/djbota.png" alt="DJ BOTA"><i class="slash" aria-hidden="true"></i></span>
        <span class="ro">Turnos de DJ Bota y de Two Generation's</span>
      </button>
    </div>
    <div class="sel-foot" id="selFoot"></div>
  </div>
</div>

<!-- Luces de fondo (se ven a través del cristal) -->
<div class="bg" aria-hidden="true"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i><i class="orb o4"></i></div>

<!-- Panel -->
<main id="app"><div id="view"></div></main>
<nav class="glass dock hidden" id="dock" aria-label="Secciones del panel"></nav>

<!-- Formulario de turno -->
<div class="overlay" id="modal" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <span class="grab" aria-hidden="true"></span>
    <h3 id="mTitle">Nuevo turno</h3>
    <p class="ms" id="mSub"></p>
    <form id="form" autocomplete="off">
      <div class="f"><label for="f_title">Título (el que verás en el calendario)</label><input id="f_title" required placeholder="DJ Torralba"></div>
      <div class="f"><label for="f_dj">De quién es</label>
        <select id="f_dj"><option value="Clement">CLEMENT</option><option value="DJ Bota">DJ BOTA</option><option value="Two Generation's">TWO GENERATION'S (sale en las dos agendas)</option></select></div>
      <div class="r2">
        <div class="f"><label for="f_lugar">Pueblo o ciudad</label><input id="f_lugar" required placeholder="Torralba"></div>
        <div class="f"><label for="f_local">Local o sala</label><input id="f_local" required placeholder="Sala Euforia"></div>
      </div>
      <div class="r2">
        <div class="f"><label for="f_date">Fecha</label><input id="f_date" type="date" required></div>
        <div class="f"><label for="f_cache">Caché (€)</label><input id="f_cache" type="number" min="0" step="any" inputmode="decimal" required placeholder="200"></div>
      </div>
      <!-- Reparto del caché en los turnos de Two Generation's -->
      <div class="split" id="splitBox" hidden>
        <p class="split-h">Reparto del caché</p>
        <div class="r2">
          <div class="f"><label for="f_pc">Cuánto se lleva CLEMENT (€)</label><input id="f_pc" type="number" min="0" step="any" inputmode="decimal" placeholder="0"></div>
          <div class="f"><label for="f_pb">Cuánto se lleva DJ BOTA (€)</label><input id="f_pb" type="number" min="0" step="any" inputmode="decimal" placeholder="0"></div>
        </div>
        <p class="split-sum" id="splitSum"></p>
      </div>
      <div class="r2">
        <div class="f"><label for="f_start">Empieza</label><input id="f_start" type="time" required></div>
        <div class="f"><label for="f_end">Termina</label><input id="f_end" type="time" required></div>
      </div>
      <div class="f"><label for="f_llevar">Qué llevar</label><input id="f_llevar" placeholder="Cascos y USB"></div>
      <div class="ferr" id="ferr" role="alert"></div>
      <div class="mact">
        <button type="button" class="btn" data-act="closeModal">Cancelar</button>
        <button type="submit" class="btn primary" id="fSave">Guardar turno</button>
      </div>
    </form>
  </div>
</div>

<!-- Hojas (ajustes / elegir calendario) -->
<div class="overlay" id="sheet" aria-hidden="true"><div class="modal" role="dialog" aria-modal="true"><span class="grab" aria-hidden="true"></span><div id="sheetBody"></div></div></div>

<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
